---
# Refuse anything that could lock the operator out, before any write.

- name: Check that every node is part of this run
  # The datacenter file is cluster-wide: each node must be checked and confirmed.
  ansible.builtin.assert:
    that: groups['pve'] | difference(ansible_play_hosts_all) | length == 0
    fail_msg: >-
      The datacenter firewall file applies to every node: run on all of them
      (drop --limit), so each one is checked and confirmed. Nothing was changed.
    quiet: true
  run_once: true

- name: Refuse unusable firewall variables
  ansible.builtin.assert:
    that:
      - pve_firewall_policy_in in ['ACCEPT', 'DROP', 'REJECT']
      - pve_firewall_policy_out in ['ACCEPT', 'DROP', 'REJECT']
      - pve_firewall_management | length > 0
      - pve_firewall_rollback_delay | int >= 150
    fail_msg: >-
      pve_firewall_policy_in/out must be ACCEPT, DROP or REJECT,
      pve_firewall_management must list at least one network, and
      pve_firewall_rollback_delay must be at least 150 seconds (the confirmation can take that long). Nothing was changed.
    quiet: true

- name: Check whether Ansible connects from a management address
  # The address this SSH session comes from, as the node sees it. Python's
  # ipaddress module, on the node: the controller has no netaddr.
  ansible.builtin.command:
    argv: >-
      {{ ['python3', '-c',
          'import ipaddress, sys; a = ipaddress.ip_address(sys.argv[1]); '
          ~ 'nets = [ipaddress.ip_network(n, strict=False) for n in sys.argv[2:]]; '
          ~ 'sys.exit(0 if any(a in n for n in nets) else 2)',
          ansible_facts['env']['SSH_CLIENT'].split() | first] + pve_firewall_management }}
  register: pve_firewall_controller_in
  changed_when: false
  check_mode: false
  failed_when: false

- name: Refuse an invalid management network
  # An invalid entry raises in Python (exit 1); "not inside" exits 2.
  ansible.builtin.assert:
    that: pve_firewall_controller_in.rc in [0, 2]
    fail_msg: >-
      A pve_firewall_management entry is not a valid network
      ({{ pve_firewall_controller_in.stderr_lines[-1] | default('') }}).
      Nothing was changed.
    quiet: true

- name: Refuse unless Ansible connects from a management address
  ansible.builtin.assert:
    that: pve_firewall_controller_in.rc == 0
    fail_msg: >-
      Ansible reaches {{ inventory_hostname }} from {{ ansible_facts['env']['SSH_CLIENT'].split() | first }},
      which is not in pve_firewall_management: the new rules could lock it out.
      Nothing was changed.
    quiet: true

- name: Check for a rollback still pending from an earlier run
  ansible.builtin.command:
    argv: [systemctl, is-active, pve-firewall-rollback.timer]
  register: pve_firewall_pending
  changed_when: false
  check_mode: false
  failed_when: false

- name: Refuse while an earlier rollback is pending
  ansible.builtin.assert:
    that: pve_firewall_pending.rc != 0
    fail_msg: >-
      A rollback of the firewall file is still armed on {{ inventory_hostname }}
      (pve-firewall-rollback.timer): an earlier run did not finish. Let it fire,
      or stop it (systemctl stop pve-firewall-rollback.timer) once the current
      file is known to be good. Nothing was changed.
    quiet: true

- name: Refuse a declared guest that does not exist
  ansible.builtin.assert:
    that: pve_firewall_guest_files | rejectattr('exists') | list | length == 0
    fail_msg: >-
      pve_firewall_guests names guests Proxmox does not have:
      {{ pve_firewall_guest_files | rejectattr('exists') | map(attribute='vmid') | join(', ') }}.
      Nothing was changed.
    quiet: true
  run_once: true

- name: Refuse a guest whose configuration could not be read
  # Without it the NICs cannot be checked: refuse rather than assume they are fine.
  ansible.builtin.assert:
    that: pve_firewall_guest_files | selectattr('exists') | rejectattr('config_read') | list | length == 0
    fail_msg: >-
      Could not read the configuration of guest(s)
      {{ pve_firewall_guest_files | selectattr('exists') | rejectattr('config_read') | map(attribute='vmid') | join(', ') }}.
      Nothing was changed.
    quiet: true
  run_once: true

- name: Refuse a guest with a NIC its firewall would not filter
  # A guest's rules apply only on NICs with firewall=1; the role never edits a
  # guest, so it refuses instead of enabling rules that would not apply.
  ansible.builtin.assert:
    that: pve_firewall_guest_files | selectattr('nics_without_flag') | list | length == 0
    fail_msg: >-
      These guests have NICs without firewall=1:
      {% for g in pve_firewall_guest_files | selectattr('nics_without_flag') %}{{ g.vmid }} ({{ g.nics_without_flag | join(', ') }}) {% endfor %}.
      Set firewall=1 on the NIC (Proxmox applies it when the guest's network is
      reconfigured; a pending change shows in the guest's Pending tab), or drop
      the guest from pve_firewall_guests. Nothing was changed.
    quiet: true
  run_once: true

- name: Refuse a guest that names an unknown group
  ansible.builtin.assert:
    that: >-
      pve_firewall_guests | map(attribute='groups', default=[]) | flatten | unique
      | difference(pve_firewall_groups | map(attribute='name')) | length == 0
    fail_msg: >-
      pve_firewall_guests names groups not in pve_firewall_groups:
      {{ pve_firewall_guests | map(attribute='groups', default=[]) | flatten | unique
         | difference(pve_firewall_groups | map(attribute='name')) | join(', ') }}. Nothing was changed.
    quiet: true
  run_once: true

- name: Refuse duplicate IP set names
  # A declared set named like "management" or an SDN network would write the
  # same section twice.
  vars:
    pve_firewall_ipset_clash: >-
      {{ pve_firewall_ipsets.keys() | list | intersect(['management'] + pve_firewall_dnsmasq_vnets) }}
  ansible.builtin.assert:
    that: pve_firewall_ipset_clash | length == 0
    fail_msg: >-
      pve_firewall_ipsets names sets the role already writes (the built-in
      management set and the SDN networks): {{ pve_firewall_ipset_clash | join(', ') }}.
      Nothing was changed.
    quiet: true
  run_once: true

- name: Refuse IP set and group names Proxmox would not keep
  # Proxmox lowercases these names and limits groups to 18 characters.
  vars:
    pve_firewall_bad_names: >-
      {{ (pve_firewall_all_ipsets | map(attribute='name') | list + pve_firewall_groups | map(attribute='name') | list)
         | reject('match', '^[a-z][a-z0-9_-]{1,17}$') | list }}
  ansible.builtin.assert:
    that: pve_firewall_bad_names | length == 0
    fail_msg: >-
      IP set and group names must match ^[a-z][a-z0-9_-]{1,17}$ (lowercase,
      at most 18 characters): {{ pve_firewall_bad_names | join(', ') }}.
      Nothing was changed.
    quiet: true
  run_once: true

- name: Refuse a rule that names an unknown IP set
  vars:
    pve_firewall_rule_lines: >-
      {{ pve_firewall_groups | map(attribute='rules', default=[]) | flatten
         + pve_firewall_guests | map(attribute='rules', default=[]) | flatten }}
    pve_firewall_ipset_refs: >-
      {{ pve_firewall_rule_lines | map('regex_findall', '\+dc/([A-Za-z0-9_-]+)') | flatten | unique | list }}
    pve_firewall_unknown_refs: >-
      {{ pve_firewall_ipset_refs | difference(pve_firewall_all_ipsets | map(attribute='name') | list) }}
  ansible.builtin.assert:
    that: pve_firewall_unknown_refs | length == 0
    fail_msg: >-
      Rules refer to IP sets that do not exist: {{ pve_firewall_unknown_refs | join(', ') }}.
      Nothing was changed.
    quiet: true
  run_once: true
