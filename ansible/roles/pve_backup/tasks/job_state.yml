---
# The backup job as Proxmox has it, its arguments, and what differs from the
# declaration. Read-only; imported twice by job.yml (before and after).

- name: Read the backup jobs
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/backup, --output-format, json]
  register: pve_backup_jobs_raw
  changed_when: false
  check_mode: false

- name: Compare the backup job with the declaration
  ansible.builtin.set_fact:
    pve_backup_job_have: >-
      {{ pve_backup_jobs_raw.stdout | from_json
         | selectattr('id', 'eq', pve_backup_job_id) | first | default({}) }}
    # Plain fields, compared as strings. --all with --node: every guest of
    # this node, and the job does not run on nodes without the storage.
    pve_backup_job_want:
      all: 1
      node: "{{ ansible_facts['hostname'] }}"
      schedule: "{{ pve_backup_schedule }}"
      storage: "{{ pve_backup_storage }}"
      mode: "{{ pve_backup_mode }}"
      compress: "{{ pve_backup_compress }}"
      tmpdir: "{{ pve_backup_tmpdir }}"
      enabled: 1
      comment: "{{ pve_backup_job_comment }}"
    # Canonical retention string; Proxmox returns the values as strings, the
    # declaration has integers: both render keep-daily=1.
    pve_backup_job_prune: >-
      {{ pve_backup_retention | dictsort | map('join', '=') | join(',') }}

- name: List the fields that differ
  # Proxmox returns prune-backups and fleecing as objects (property strings
  # only on input); 'enabled' may be left out when it is the default (1).
  ansible.builtin.set_fact:
    pve_backup_job_drift: >-
      {%- set ns = namespace(out=[]) -%}
      {%- set api_defaults = {'enabled': 1} -%}
      {%- for key, value in pve_backup_job_want.items()
            if (pve_backup_job_have[key] | default(api_defaults[key] | default('')) | string) != (value | string) -%}
      {%- set ns.out = ns.out + [key] -%}
      {%- endfor -%}
      {%- if (pve_backup_job_have['prune-backups'] | default({}) | dictsort | map('join', '=') | join(','))
            != pve_backup_job_prune -%}
      {%- set ns.out = ns.out + ['prune-backups'] -%}
      {%- endif -%}
      {%- set fleecing = pve_backup_job_have.fleecing | default({}) -%}
      {%- if (fleecing.enabled | default(0) | int) != 1
            or (fleecing.storage | default('')) != pve_backup_fleecing_storage -%}
      {%- set ns.out = ns.out + ['fleecing'] -%}
      {%- endif -%}
      {{ ns.out | unique }}
    # One argument list for creating and for correcting the job.
    pve_backup_job_args:
      - --all
      - "1"
      - --node
      - "{{ ansible_facts['hostname'] }}"
      - --schedule
      - "{{ pve_backup_schedule }}"
      - --storage
      - "{{ pve_backup_storage }}"
      - --mode
      - "{{ pve_backup_mode }}"
      - --compress
      - "{{ pve_backup_compress }}"
      - --tmpdir
      - "{{ pve_backup_tmpdir }}"
      - --prune-backups
      - "{{ pve_backup_job_prune }}"
      - --fleecing
      - "enabled=1,storage={{ pve_backup_fleecing_storage }}"
      - --enabled
      - "1"
      - --comment
      - "{{ pve_backup_job_comment }}"
