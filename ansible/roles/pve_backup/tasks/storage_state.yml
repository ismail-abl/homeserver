---
# The storage entry as Proxmox has it, and what differs from the
# declaration. Read-only; imported twice by storage.yml (before and after).

- name: Read the backup storage entry
  ansible.builtin.command:
    argv: [pvesh, get, "/storage/{{ pve_backup_storage }}", --output-format, json]
  register: pve_backup_storage_raw
  changed_when: false
  check_mode: false
  failed_when: >-
    pve_backup_storage_raw.rc != 0
    and 'does not exist' not in (pve_backup_storage_raw.stderr ~ pve_backup_storage_raw.stdout)

- name: Compare the storage entry with the declaration
  ansible.builtin.set_fact:
    pve_backup_storage_have: >-
      {{ (pve_backup_storage_raw.stdout | from_json) if pve_backup_storage_raw.rc == 0 else {} }}
    pve_backup_storage_want:
      type: dir
      path: "{{ pve_backup_dir }}"
      content: backup
      nodes: "{{ ansible_facts['hostname'] }}"
      is_mountpoint: "{{ pve_backup_mountpoint }}"
      create-base-path: 0

- name: List the fields that differ
  ansible.builtin.set_fact:
    pve_backup_storage_drift: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for key, value in pve_backup_storage_want.items()
            if (pve_backup_storage_have[key] | default('') | string) != (value | string) -%}
      {%- set ns.out = ns.out + [key] -%}
      {%- endfor -%}
      {{ ns.out }}
