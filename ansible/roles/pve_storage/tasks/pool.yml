---
# The pool for guest disks lives in its own partition at the end of the system
# disk, outside the system's LVM partition, so a reinstall of Proxmox leaves it
# intact. The role only ever fills unpartitioned space: it never resizes or
# rewrites a partition.

# --- State (read-only, runs in check mode too) ---

- name: Look for the pool's partition by its GPT name
  ansible.builtin.stat:
    path: "/dev/disk/by-partlabel/{{ pve_storage_partlabel }}"
  register: pve_storage_part

- name: List the imported pools
  ansible.builtin.command: pvesh get /nodes/localhost/disks/zfs --output-format json
  register: pve_storage_pools_raw
  changed_when: false
  check_mode: false

- name: List the pools that could be imported
  # Without a pool name, zpool import only lists. Same device directory as
  # Proxmox's import unit.
  ansible.builtin.command: zpool import -d /dev/disk/by-id
  register: pve_storage_importable_raw
  changed_when: false
  check_mode: false

- name: Index the pool state
  ansible.builtin.set_fact:
    pve_storage_imported: >-
      {{ pve_storage_pool in (pve_storage_pools_raw.stdout | from_json | map(attribute='name') | list) }}
    pve_storage_importable: >-
      {{ pve_storage_importable_raw.stdout is search('(?m)^\s*pool: ' ~ (pve_storage_pool | regex_escape) ~ '$') }}

# --- Import: the partition is there, the pool is not imported (a reinstall) ---

- name: Import the existing pool
  when:
    - not pve_storage_imported | bool
    - pve_storage_part.stat.exists
  block:
    - name: Refuse unless zpool import offers the pool
      ansible.builtin.assert:
        that: pve_storage_importable | bool
        fail_msg: >-
          {{ pve_storage_partlabel }} exists on {{ inventory_hostname }}, but zpool
          import does not offer {{ pve_storage_pool }}. Nothing was changed. If a
          creation stopped half way (partition made, pool not), the partition is
          empty: check it with blkid, delete it (sgdisk -d <number> <disk>, then
          partx -d --nr <number> <disk>) and run again.
        quiet: true

    - name: Import the pool
      ansible.builtin.command: >-
        zpool import -d /dev/disk/by-id
        {{ '-f' if pve_storage_force_import | bool else '' }} {{ pve_storage_pool }}
      register: pve_storage_import
      changed_when: pve_storage_import.rc == 0
      failed_when: false

    - name: Explain a refused import
      ansible.builtin.fail:
        msg: >-
          zpool import {{ pve_storage_pool }} failed on {{ inventory_hostname }}:
          {{ pve_storage_import.stderr | trim }}
          {% if 'another system' in pve_storage_import.stderr %}
          The pool was last imported by another system, which a reinstall causes
          (the node gets a new hostid). If no other machine can reach this disk,
          run again with -e pve_storage_force_import=true.
          {% endif %}
      when:
        - not ansible_check_mode
        - pve_storage_import.rc != 0

# --- Creation: neither pool nor partition ---

- name: Create the pool in the free space at the end of the system disk
  when:
    - not pve_storage_imported | bool
    - not pve_storage_part.stat.exists
  block:
    - name: Find the disk that carries the root filesystem
      ansible.builtin.shell: |
        set -o pipefail
        lsblk -nrso NAME,TYPE "$(findmnt -nvo SOURCE /)" | awk '$2 == "disk" { print "/dev/" $1 }'
      args:
        executable: /bin/bash
      register: pve_storage_disks
      changed_when: false
      check_mode: false

    - name: Refuse unless exactly one disk carries the root filesystem
      ansible.builtin.assert:
        that: pve_storage_disks.stdout_lines | length == 1
        fail_msg: >-
          The root filesystem of {{ inventory_hostname }} sits on
          {{ pve_storage_disks.stdout_lines | length }} disks
          ({{ pve_storage_disks.stdout_lines | join(', ') }}); the role handles one.
          Nothing was changed.
        quiet: true

    - name: Read the largest free block and the disk's last usable sector
      # -a 2048 aligns the start to 1 MiB: without it sgdisk falls back to
      # 8-sector alignment after partitions that do not end on a 1 MiB boundary,
      # and the installer's do not.
      ansible.builtin.shell: |
        set -o pipefail
        sgdisk -a 2048 -F -E {{ pve_storage_disks.stdout_lines[0] }}
        sgdisk -p {{ pve_storage_disks.stdout_lines[0] }} | sed -n 's/.*last usable sector is \([0-9]*\).*/\1/p'
        lsblk -ndo LOG-SEC {{ pve_storage_disks.stdout_lines[0] }}
      args:
        executable: /bin/bash
      register: pve_storage_free
      changed_when: false
      check_mode: false

    - name: Index the disk and its free block
      ansible.builtin.set_fact:
        pve_storage_disk: "{{ pve_storage_disks.stdout_lines[0] }}"
        pve_storage_free_first: "{{ pve_storage_free.stdout_lines[0] | trim | int }}"
        pve_storage_free_end: "{{ pve_storage_free.stdout_lines[1] | trim | int }}"
        pve_storage_last_usable: "{{ pve_storage_free.stdout_lines[2] | trim | int }}"
        pve_storage_free_gib: >-
          {{ ((pve_storage_free.stdout_lines[1] | trim | int)
              - (pve_storage_free.stdout_lines[0] | trim | int) + 1)
             * (pve_storage_free.stdout_lines[3] | trim | int) / 1073741824 }}

    - name: Refuse unless the free block ends the disk and is big enough
      ansible.builtin.assert:
        that:
          - pve_storage_free_end | int == pve_storage_last_usable | int
          - pve_storage_free_gib | float >= pve_storage_min_free_gib | float
        fail_msg: >-
          {{ pve_storage_disk }} on {{ inventory_hostname }}: the largest free block is
          {{ pve_storage_free_gib | float | round(1) }} GiB and ends at sector
          {{ pve_storage_free_end }} (last usable: {{ pve_storage_last_usable }}). The
          pool needs at least {{ pve_storage_min_free_gib }} GiB unpartitioned at the
          end of the disk. Nothing was changed.
        quiet: true

    - name: Refuse to create a twin of a pool that already exists
      ansible.builtin.assert:
        that: not pve_storage_importable | bool
        fail_msg: >-
          zpool import offers a pool named {{ pve_storage_pool }} on
          {{ inventory_hostname }}, but no partition is named
          {{ pve_storage_partlabel }}. Investigate by hand; nothing was changed.
        quiet: true

    - name: Create the pool's partition in the free block
      # Partition number 0: the next free one; 0 in -t and -c then refers to it.
      # Type 8300 (plain Linux), not ZFS's BF01: Proxmox counts a partition of
      # the ZFS type as already in use and refuses to build a pool on it. It sets
      # BF01 itself, once it has checked the partition is free.
      ansible.builtin.command: >-
        sgdisk -a 2048
        -n 0:{{ pve_storage_free_first }}:{{ pve_storage_free_end }}
        -t 0:8300 -c 0:{{ pve_storage_partlabel }}
        {{ pve_storage_disk }}
      changed_when: true

    - name: Make the kernel read the new partition
      # The disk is in use (it carries the root), so sgdisk cannot make the
      # kernel re-read the whole table; partx adds the new partition alone.
      ansible.builtin.command: "partx -u {{ pve_storage_disk }}"
      changed_when: false
      when: not ansible_check_mode

    - name: Wait for udev to create the partition's links
      ansible.builtin.command: udevadm settle
      changed_when: false
      when: not ansible_check_mode

    - name: Assert the partition is reachable by its name
      ansible.builtin.stat:
        path: "/dev/disk/by-partlabel/{{ pve_storage_partlabel }}"
      register: pve_storage_new_part
      failed_when: not pve_storage_new_part.stat.exists
      when: not ansible_check_mode

    - name: Create the pool with Proxmox's own tool
      # Not zpool create: pvesh also sets the partition type, builds the pool on
      # the partition's by-id link and enables the pool's import unit at boot.
      ansible.builtin.command: >-
        pvesh create /nodes/localhost/disks/zfs
        --name {{ pve_storage_pool }}
        --devices {{ pve_storage_new_part.stat.lnk_source }}
        --raidlevel single
        --ashift {{ pve_storage_ashift }}
        --compression {{ pve_storage_compression }}
      changed_when: true
      when: not ansible_check_mode

    - name: Assert the pool now exists
      ansible.builtin.command: "zpool list -H -o name {{ pve_storage_pool }}"
      changed_when: false
      when: not ansible_check_mode

# --- Import at boot (both paths) ---

- name: Escape the pool name for its systemd unit
  # In zfs-import@<instance>, a '-' must be written \x2d, or the unit's %I
  # turns it into '/' and imports the wrong pool name.
  ansible.builtin.command: "systemd-escape {{ pve_storage_pool }}"
  register: pve_storage_unit_instance
  changed_when: false
  check_mode: false

- name: Import the pool at boot with Proxmox's unit
  ansible.builtin.systemd:
    name: "zfs-import@{{ pve_storage_unit_instance.stdout }}.service"
    enabled: true

# --- The storage entry (storage.cfg is shared by the cluster: the play runs
#     one node at a time, so each node reads it, then adds itself) ---

- name: Read the storage entry
  ansible.builtin.command: "pvesh get /storage/{{ pve_storage_pool }} --output-format json"
  register: pve_storage_entry_raw
  changed_when: false
  check_mode: false
  failed_when: >-
    pve_storage_entry_raw.rc != 0
    and 'does not exist' not in (pve_storage_entry_raw.stderr ~ pve_storage_entry_raw.stdout)

- name: Index the storage entry
  ansible.builtin.set_fact:
    pve_storage_entry: "{{ (pve_storage_entry_raw.stdout | from_json) if pve_storage_entry_raw.rc == 0 else {} }}"
    pve_storage_node: "{{ ansible_facts['hostname'] }}"
    pve_storage_sparse_flag: "{{ pve_storage_sparse | bool | int }}"

- name: Declare the storage
  ansible.builtin.command: >-
    pvesm add zfspool {{ pve_storage_pool }}
    --pool {{ pve_storage_pool }}
    --content images,rootdir
    --sparse {{ pve_storage_sparse_flag }}
    --nodes {{ pve_storage_node }}
  when: pve_storage_entry | length == 0
  changed_when: true

- name: Bring an existing storage entry to the wanted state
  when: pve_storage_entry | length > 0
  block:
    - name: Refuse to touch a storage that is not this pool
      ansible.builtin.assert:
        that:
          - pve_storage_entry.type == 'zfspool'
          - pve_storage_entry.pool == pve_storage_pool
        fail_msg: >-
          Storage {{ pve_storage_pool }} exists as {{ pve_storage_entry.type }}
          ({{ pve_storage_entry.pool | default('no pool') }}), not as the ZFS pool
          {{ pve_storage_pool }}. It is left alone; fix it by hand.
        quiet: true

    - name: Add this node to the storage's node list
      # No list means every node: left as is.
      ansible.builtin.command: >-
        pvesm set {{ pve_storage_pool }}
        --nodes {{ (pve_storage_entry.nodes.split(',') + [pve_storage_node]) | sort | join(',') }}
      when:
        - pve_storage_entry.nodes is defined
        - pve_storage_node not in pve_storage_entry.nodes.split(',')
      changed_when: true

    - name: Set thin provisioning
      ansible.builtin.command: "pvesm set {{ pve_storage_pool }} --sparse {{ pve_storage_sparse_flag }}"
      when: (pve_storage_entry.sparse | default(0) | int) != (pve_storage_sparse_flag | int)
      changed_when: true

    - name: Set the content types
      ansible.builtin.command: "pvesm set {{ pve_storage_pool }} --content images,rootdir"
      when: (pve_storage_entry.content.split(',') | sort) != ['images', 'rootdir']
      changed_when: true

- name: Read the storage entry back
  ansible.builtin.command: "pvesh get /storage/{{ pve_storage_pool }} --output-format json"
  register: pve_storage_final_raw
  changed_when: false
  when: not ansible_check_mode

- name: Assert the storage entry is as wanted
  ansible.builtin.assert:
    that:
      - (pve_storage_final_raw.stdout | from_json).type == 'zfspool'
      - (pve_storage_final_raw.stdout | from_json).pool == pve_storage_pool
      - ((pve_storage_final_raw.stdout | from_json).content.split(',') | sort) == ['images', 'rootdir']
      - ((pve_storage_final_raw.stdout | from_json).sparse | default(0) | int) == (pve_storage_sparse_flag | int)
      - >-
        (pve_storage_final_raw.stdout | from_json).nodes is not defined
        or pve_storage_node in (pve_storage_final_raw.stdout | from_json).nodes.split(',')
    quiet: true
  when: not ansible_check_mode
