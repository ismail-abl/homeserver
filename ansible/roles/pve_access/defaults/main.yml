---
# defaults file for pve_access
#
# Users, groups, roles, ACLs and pools are cluster-wide: Proxmox keeps them in
# /etc/pve, which every node shares, so the role writes them once.

# Custom roles, each with its whole privilege list. The role owns them: a
# privilege added or removed by hand is put back as declared.
# VMOperator = PVEVMAdmin, plus what a guest needs to exist: space on a
# storage for its disks and ISOs, a bridge or vnet for its NICs, and the node
# and pool views the web UI needs to create one.
pve_access_roles:
  - name: VMOperator
    privs:
      - VM.Allocate
      - VM.Audit
      - VM.Backup
      - VM.Clone
      - VM.Config.CDROM
      - VM.Config.CPU
      - VM.Config.Cloudinit
      - VM.Config.Disk
      - VM.Config.HWType
      - VM.Config.Memory
      - VM.Config.Network
      - VM.Config.Options
      - VM.Console
      - VM.GuestAgent.Audit
      - VM.GuestAgent.FileRead
      - VM.GuestAgent.FileSystemMgmt
      - VM.GuestAgent.FileWrite
      - VM.GuestAgent.Unrestricted
      - VM.Migrate
      - VM.PowerMgmt
      - VM.Replicate
      - VM.Snapshot
      - VM.Snapshot.Rollback
      - Datastore.Audit
      - Datastore.AllocateSpace
      - SDN.Audit
      - SDN.Use
      - Sys.Audit
      - Pool.Audit

# Groups ({name, comment}), users ({userid, groups, email}) and ACLs
# ({path, group, role}, always propagated). Declared in group_vars.
pve_access_groups: []
pve_access_users: []
pve_access_acls: []

# Pools ({name, comment, vmids}). Declared once for every role, in group_vars.
pve_access_pools: "{{ pve_pools | default([]) }}"
