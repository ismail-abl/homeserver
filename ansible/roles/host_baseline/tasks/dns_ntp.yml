---
# Tasks related to DNS and NTP configurations
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Configure Chrony (NTP/NTS)
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart chrony

- name: Configure DNS (resolv.conf)
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'
