---
# CPU frequency policy: the governor of every CPU and the global boost switch,
# written at every boot by systemd-tmpfiles, and applied live when the node
# differs, so a manual change is corrected too.

- name: Read the CPU governors this node offers
  ansible.builtin.slurp:
    src: /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors
  register: host_baseline_cpu_available

- name: Look for the global boost switch
  ansible.builtin.stat:
    path: /sys/devices/system/cpu/cpufreq/boost
  register: host_baseline_cpu_boost_switch

- name: Refuse a policy this node cannot take
  ansible.builtin.assert:
    that:
      - host_baseline_cpu_governor in (host_baseline_cpu_available.content | b64decode).split()
      - host_baseline_cpu_boost_switch.stat.exists
    fail_msg: >-
      {{ inventory_hostname }} offers the governors
      {{ (host_baseline_cpu_available.content | b64decode).split() | join(', ') }}
      (wanted: {{ host_baseline_cpu_governor }}), and
      {{ 'has' if host_baseline_cpu_boost_switch.stat.exists else 'has no' }} global
      boost switch. Nothing was changed.
    quiet: true

- name: Set the CPU policy for every boot
  ansible.builtin.template:
    src: cpufreq.conf.j2
    dest: /etc/tmpfiles.d/cpufreq.conf
    owner: root
    group: root
    mode: "0644"

- name: Read the live CPU policy
  ansible.builtin.shell: |
    set -o pipefail
    cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u
    cat /sys/devices/system/cpu/cpufreq/boost
  args:
    executable: /bin/bash
  register: host_baseline_cpu_live
  changed_when: false
  check_mode: false

- name: Compare the live CPU policy with the wanted one
  ansible.builtin.set_fact:
    host_baseline_cpu_drift: >-
      {{ host_baseline_cpu_live.stdout_lines
         != [host_baseline_cpu_governor, host_baseline_cpu_boost | bool | ternary('1', '0')] }}

- name: Apply the CPU policy live
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/cpufreq.conf
  when:
    - host_baseline_cpu_drift | bool
    - not ansible_check_mode
  changed_when: true

- name: Report the live drift (check mode)
  # Check mode skips commands, so the task above would not show the drift.
  ansible.builtin.debug:
    msg: >-
      Live policy {{ host_baseline_cpu_live.stdout_lines | join(' / boost ') }} would be set to
      {{ host_baseline_cpu_governor }} / boost {{ host_baseline_cpu_boost | bool | ternary('1', '0') }}.
  when:
    - host_baseline_cpu_drift | bool
    - ansible_check_mode
  changed_when: true
