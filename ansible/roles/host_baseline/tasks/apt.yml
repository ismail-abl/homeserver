---
# Tasks related to APT sources

- name: Remove Proxmox Enterprise and Ceph repositories (both legacy .list and modern .sources)
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - pve-enterprise.list
    - pve-enterprise.sources
    - ceph.list
    - proxmox.sources
    - ceph.sources
    - debian.sources

- name: Add Proxmox No-Subscription repository
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve {{ ansible_facts['distribution_release'] }} pve-no-subscription"
    state: present
    filename: pve-no-subscription
    update_cache: false

- name: Add Ceph No-Subscription repository
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/ceph-squid {{ ansible_facts['distribution_release'] }} no-subscription"
    state: present
    filename: ceph-no-subscription
    update_cache: false

- name: Set Debian sources to closer mirror (init7)
  ansible.builtin.template:
    src: sources.list.j2
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: '0644'
  notify: Update APT cache

- name: Force APT cache update
  ansible.builtin.meta: flush_handlers

- name: Full system upgrade (dist-upgrade) and autoremove
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
  notify: "Evaluate Reboot"

- name: Install common utility packages
  ansible.builtin.apt:
    name: "{{ host_baseline_core_packages + host_baseline_extra_packages }}"
    state: present
