---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true

- name: Restart systemd-logind
  ansible.builtin.systemd:
    name: systemd-logind
    state: restarted

- name: Restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

- name: Check if a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: host_baseline_reboot_required
  listen: "Evaluate Reboot"

- name: Reboot the server if required
  ansible.builtin.reboot:
    msg: "Reboot initiated by Ansible after dist-upgrade"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami
  when: host_baseline_reboot_required.stat.exists | default(false)
  listen: "Evaluate Reboot"
