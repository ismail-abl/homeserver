---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true

- name: Restart systemd-logind
  ansible.builtin.systemd:
    name: systemd-logind
    state: restarted

- name: Restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

- name: Check if a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: host_baseline_reboot_required
  listen: "Evaluate Reboot"

- name: Reboot the server if required
  ansible.builtin.reboot:
    msg: "Reboot initiated by Ansible after dist-upgrade"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami
  when: host_baseline_reboot_required.stat.exists | default(false)
  listen: "Evaluate Reboot"

# Reconfiguring zram is stop, then one start. A restart of the setup service
# races with the swap unit it restarts in turn (and with udev events from the
# reformatted device): several starts of dev-zram0.swap hit its start limit and
# the device stays busy. Stopping the swap stops the setup service too (it is
# bound to the swap) and resets the device; the single start then sets it up
# again from the new configuration.
- name: Stop the zram swap
  ansible.builtin.systemd:
    name: dev-zram0.swap
    state: stopped
  listen: Restart zram swap
  when: not ansible_check_mode

- name: Clear the zram units' failed state
  # A failed or rate-limited unit refuses to start until reset.
  ansible.builtin.command: systemctl reset-failed dev-zram0.swap systemd-zram-setup@zram0.service
  changed_when: false
  failed_when: false
  listen: Restart zram swap
  when: not ansible_check_mode

- name: Start the zram swap
  ansible.builtin.systemd:
    name: dev-zram0.swap
    state: started
    daemon_reload: true
  listen: Restart zram swap
  when: not ansible_check_mode
