---
# group_vars/pve/public.yml
# Variables specific to physical hosts (Proxmox VE)

# Proxmox cluster name
pve_cluster_name: "homeserver"

# Default management network interface
pve_management_interface: "vmbr0"

# CPU frequency policy for every node (host_baseline). Without boost, short
# bursts no longer push the CPU past the point where a laptop's embedded
# controller runs the fan at full speed (measured on one node, same load:
# 40-42 °C instead of 71-80 °C); the fan itself cannot be driven from Linux.
host_baseline_cpu_governor: schedutil
host_baseline_cpu_boost: false

# --- Pools: every guest, declared once ---
# pve_access creates the pools and puts the guests in them; the replication
# and backup roles select guests by pool. VMIDs only.
pve_pools:
  - name: media
    comment: Media stack
    vmids: [201, 202, 203, 204, 205, 206]
  - name: infra
    comment: Reverse proxy, DNS, file transfer
    vmids: [199, 200, 999]
  - name: domotique
    comment: Home automation
    vmids: [1000]
  - name: lab
    comment: Experiments and stopped guests
    vmids: [100, 101, 105, 1001]

# --- Access (pve_access): rights go to groups, never to users ---
pve_access_groups:
  - name: admins
    comment: Full administration
  - name: operators
    comment: Every guest; no node, cluster or user settings
  - name: viewers
    comment: Read-only, for monitoring clients

# Created without a password: each is typed once by hand (pveum passwd) and
# stored nowhere.
pve_access_users:
  - userid: ismail.admin@pve
    groups: [admins]
    email: "{{ admin_email }}"
  - userid: ismail@pve
    groups: [operators]
    email: "{{ admin_email }}"

# VMOperator only means something where its privileges are checked: guests
# (/vms), the storages a guest uses, the networks a NIC attaches to (every
# zone, including the plain bridges of 'localnetwork'), node status (Sys.Audit)
# and pools (Pool.Audit).
pve_access_acls:
  - { path: /, group: admins, role: Administrator }
  - { path: /, group: viewers, role: PVEAuditor }
  - { path: /vms, group: operators, role: VMOperator }
  - { path: /storage/pve-data, group: operators, role: VMOperator }
  - { path: /storage/local, group: operators, role: VMOperator }
  - { path: /sdn/zones, group: operators, role: VMOperator }
  - { path: /nodes, group: operators, role: VMOperator }
  - { path: /pool, group: operators, role: VMOperator }

# --- Backups (pve_backup) ---
# The node the external disk is plugged into: the backup storage and the
# daily job live there.
pve_backup_node: node1

# --- Replication (pve_replication) ---
# Every guest not already on this node gets a copy here, refreshed every
# 15 minutes. A warm copy, brought up by hand, not a failover.
pve_replication_target: node2

# --- Firewall (pve_firewall) ---
# Web UI and API, and ping, from the home LAN only (both address families, from
# the vault). SSH from anywhere: logins are key-only.
pve_firewall_management: "{{ lan_cidrs }}"
pve_firewall_ssh_from_anywhere: true

# The home LAN as an IP set guests' rules can name (+dc/lan).
pve_firewall_ipsets:
  lan: "{{ lan_cidrs }}"

# What each filtered guest accepts. Everything else coming in is dropped.
pve_firewall_groups:
  - name: ping
    comment: Ping from the LAN
    rules:
      - IN Ping(ACCEPT) -source +dc/lan
  - name: web-public
    comment: HTTP and HTTPS from anywhere
    rules:
      - IN HTTP(ACCEPT)
      - IN HTTPS(ACCEPT)
      - "IN ACCEPT -p udp -dport 443 # HTTP/3"
  - name: torrent
    comment: BitTorrent peers from anywhere
    rules:
      - IN ACCEPT -p tcp -dport 8099
      - IN ACCEPT -p udp -dport 8099
  - name: torrent-ui
    comment: Torrent web UI from the LAN and the guests
    rules:
      - IN ACCEPT -source +dc/lan -p tcp -dport 8090
      - IN ACCEPT -source +dc/homelan -p tcp -dport 8090
  - name: dns
    comment: DNS from the LAN and the guests
    rules:
      - IN DNS(ACCEPT) -source +dc/lan
      - IN DNS(ACCEPT) -source +dc/homelan
  - name: dns-ui
    comment: DNS filter web UI from the LAN
    rules:
      - IN HTTP(ACCEPT) -source +dc/lan
  - name: media
    comment: Media apps from the guests (reverse proxy, apps among themselves)
    rules:
      - IN ACCEPT -source +dc/homelan -p tcp -dport 5055,7878,8096,8989,9696
  - name: sftpgo-web
    comment: File transfer web UI and WebDAV from the reverse proxy
    rules:
      - IN ACCEPT -source +dc/homelan -p tcp -dport 8080,10080
  # Home automation discovers devices by itself: their replies come back as
  # new flows on ephemeral ports, so per-port rules would break it. Link-local
  # sources never cross a router: they can only come from the home LAN.
  - name: lan-all
    comment: Everything from the LAN, nothing from elsewhere
    rules:
      - IN ACCEPT -source +dc/lan
      - "IN ACCEPT -source fe80::/10 # link-local, mDNS over IPv6"

# Guests whose own firewall is on, added one at a time with their services checked after each.
pve_firewall_guests:
  - { vmid: 201, groups: [ping, torrent, torrent-ui] }
  - { vmid: 999, groups: [ping, dns, dns-ui] }
  - { vmid: 200, groups: [ping, web-public] }
  - { vmid: 202, groups: [ping, media] }
  - { vmid: 203, groups: [ping, media] }
  - { vmid: 204, groups: [ping, media] }
  - { vmid: 205, groups: [ping, media] }
  - { vmid: 206, groups: [ping, media] }
  - { vmid: 101, groups: [ping] }
  - { vmid: 199, groups: [ping, sftpgo-web] }
  - { vmid: 1000, groups: [ping, lan-all] }
